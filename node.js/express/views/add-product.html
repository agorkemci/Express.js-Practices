<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Main</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">

            <a href="/" class="navbar-brand">Shopping</a>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/login">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/register">Register</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 pt-4">
        <div class="row">

            <!-- Categories -->
            <div class="col-lg-3 mb-4">

                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action">
                        Category 1
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Category 2
                    </a>

                    <a href="#" class="list-group-item list-group-item-action">
                        Category 3
                    </a>
                </div>

            </div>

            <!-- Slider and Products -->
            <div class="col-lg-9">
                <form method="post" action="add-product">
                    <div class="form-group row d-flex ">
                        <label for="productName" class="col-sm-2 col-form-label">Name</label>
                        <div class="col-sm-10">
                            <input type="text" id="productName" name="productName" placeholder="Enter the name of product">
                        </div>
                        
                    </div>
                    <div  class="form-group row offset-sm-2">
                        <button type="submit" class="btn col-sm-2 btn-primary btn-success">SAVE</button>
                    </div>
                    
                </form>
               

            </div>
            <!-- End Slider and Products -->

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>
</html>
